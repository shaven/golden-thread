      ctl.appendChild(el("button", {id: b[0], type: "button", "class": b[2] ? "primary" : "", text: b[1]}));
    });
    ctl.appendChild(el("span", {id: "termstate", "class": "legend", role: "status"}));
    left.appendChild(ctl);
    var full = el("details", {}, [el("summary", {text: "Read the whole transcript as text"}),
      el("pre", {text: V.lines.map(function (L) { return (PREFIX[L.k] || "") + L.s; }).join("\n")})]);
    left.appendChild(full);
    (V.artifacts || []).forEach(function (a) {
      var m = el("section", {"class": "card made", id: "made-" + a.name}, [el("h3", {text: "What it made: " + a.title})]);
      if (a.shot) m.appendChild(el("img", {src: a.shot, alt: "Screenshot of " + a.title, loading: "lazy"}));
      m.appendChild(el("div", {"class": "row"}, [el("a", {"class": "btn", href: a.file, target: "_blank", rel: "noopener", text: "Open what it made"}),
        el("span", {"class": "legend", text: "The real file the command wrote, shown here as a screenshot. It opens in its own tab."})]));
      left.appendChild(m);
    });

    var dl = el("dl");
    dl.appendChild(el("dt", {text: "What it does"})); dl.appendChild(el("dd", {}, [gloss(V.does)]));
    dl.appendChild(el("dt", {text: "How it works"})); dl.appendChild(el("dd", {}, [gloss(V.how)]));
    if (V.detail) {
      var d = el("details", {id: "details"}, [el("summary", {text: S.plain ? "Show details" : "Details"}), el("p", {text: V.detail})]);
      if (!S.plain) d.setAttribute("open", "");
      dl.appendChild(el("dt", {text: "Under the hood"})); dl.appendChild(el("dd", {}, [d]));
    }
    if (V.when) { dl.appendChild(el("dt", {text: "When to use it"})); dl.appendChild(el("dd", {}, [gloss(V.when)])); }
    var nx = el("ul", {id: "next-list"});
    (V.next || []).forEach(function (n) { if (PAGES[n.key]) nx.appendChild(el("li", {}, [el("a", {href: hrefFor(n.key), text: n.cmd}), " — ", n.does || PAGES[n.key].variants[0].does])); });
    dl.appendChild(el("dt", {text: "What to try next"})); dl.appendChild(el("dd", {}, [nx.children.length ? nx : document.createTextNode("This is usually the last step.")]));
    right.appendChild(dl);
    main.appendChild(el("div", {"class": "two"}, [left, right]));

    if (player) player.destroy();
    player = new Player(pre, V.lines, function () { document.dispatchEvent(new CustomEvent("gt-help-done")); });
    window.__gtHelp = {player: player, key: key, variant: vi};
    $("#btn-play").addEventListener("click", function () { player.play(); });
    $("#btn-pause").addEventListener("click", function () { player.pause(); });
    $("#btn-step").addEventListener("click", function () { player.step(); });
    $("#btn-restart").addEventListener("click", function () { player.restart(); });
    $("#btn-copy").addEventListener("click", function () { copy(V.cmd, this); });
    $("#btn-walk").addEventListener("click", function () { startTour(WALK); });
    if (S.stage && stg[S.stage - 1]) player.jumpTo(stg[S.stage - 1].idx, S.auto);
    else if (S.auto) player.play();
  }
  function copy(text, btn) {
    function done(ok) { var o = btn.textContent; btn.textContent = ok ? "Copied" : "Select and copy"; setTimeout(function () { btn.textContent = o; }, 1400); }
    try {
      if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); }); return; }
    } catch (e) { /* fall through */ }
    try {
      var t = el("textarea", {"class": "sr"}); t.value = text; document.body.appendChild(t); t.select();
      var ok = document.execCommand("copy"); t.remove(); done(ok);
    } catch (e) { done(false); }
  }

  // ---------------------------------------------------------------- routing
  var lastHash = null;
  function route() {
    if (location.hash === lastHash && lastHash !== null) return;
    lastHash = location.hash; S = parse();
    if (player) { player.destroy(); player = null; }
    var main = $("#main"); main.textContent = "";
    var sel = $("#persona"); sel.value = S.persona[0] || "";
    $("#btn-plain").setAttribute("aria-pressed", String(S.plain));
    renderSide();
    if (S.key === "") renderIndex(main);
    else if (S.key === "all") renderAll(main, false);
    else if (S.key === "start") renderStart(main);
    else if (S.key === "reference") renderReference(main);
    else if (S.key === "workflows") renderWorkflows(main);
    else if (S.key === "security") renderSecurity(main);
    else if (S.key === "walkthrough") guides("walkthrough", main);
    else if (S.key === "roles") guides("roles", main);
    else if (S.key.indexOf("role:") === 0) guides("role", main, S.key.slice(5));
    else if (S.key.indexOf("run:") === 0) renderRun(main, S.key.slice(4));
    else renderCmd(main, S.key);
    document.title = (S.key === "start" ? "Getting started \u2014 " : S.key === "workflows" ? "Workflows \u2014 " : S.key === "security" ? "Security \u2014 " : S.key === "walkthrough" ? "First day \u2014 " : (S.key === "roles" || S.key.indexOf("role:") === 0) ? "Role guides \u2014 " : S.key.indexOf("run:") === 0 ? "Run a workflow \u2014 " : "") + (S.key && PAGES[S.key] ? PAGES[S.key].variants[0].cmd.split(" ")[0] + " — " : "") + "Golden Thread help";
  }

  // ---------------------------------------------------------------- the guided pointer tour
  // Steps are data: target (selector), caption, and an act the page really performs. A step whose
  // target is missing is skipped. "go:<key>" opens a command; "click" clicks the target; "fill:<text>"
  // types into it; "wait:done" waits until the terminal has finished.
  var TOUR = [
    {target: "#q", caption: "Search: type a few letters of what you want. Here, “close” finds the commands about closing.", act: "fill:close", dwell: 2200},
    {target: "#nav-foryou", caption: "For you: the commands your role uses most, in the order you would use them.", act: "click", dwell: 2000},
    {target: "#nav-all", caption: "All commands: every command is always here, grouped by what you are trying to do.", act: "click", dwell: 2000},
    {target: "#side li a[data-key=close]", caption: "Open a command to watch it run.", act: "click", dwell: 1600, fallback: "go:close"},
    {target: "#btn-play", caption: "Play: watches the command run in the simulated terminal. Nothing runs on your computer.", act: "click", dwell: 3200},
    {target: "#btn-step", caption: "Step: shows one line at a time, at your own pace.", act: "click", dwell: 2000},
    {target: "#btn-copy", caption: "Copy: copies the command so you can paste it into Claude Code.", act: "click", dwell: 1800},
    {target: "#next-list", caption: "What to try next: the commands that usually follow this one.", act: "none", dwell: 2200},
    {target: "#persona", caption: "Persona: see how another role would use gt. It reorders and highlights; nothing is hidden.", act: "none", dwell: 2400}
  ];
  var WALK = [
    {target: "#termout", caption: "This is the simulated terminal.", act: "none", dwell: 1400},
    {target: "#btn-play", caption: "The command types itself and gt's output appears line by line.", act: "restart-click", dwell: 600},
    {target: "#termout", caption: "Watching it run...", act: "wait:done", dwell: 800},
    {target: "#next-list", caption: "Done. These are the commands that usually follow.", act: "none", dwell: 2400}
  ];
  var tour = {steps: null, n: -1, timer: null, paused: false, on: false};
  var pointer = $("#pointer"), ripple = $("#ripple"), bubble = $("#bubble"), bar = $("#tourbar");
  function setBar(txt) { $("#tourstep").textContent = txt; $("#t-pause").textContent = tour.paused ? "Resume" : "Pause"; }
  function startTour(steps) {
    document.body.removeAttribute("data-tour-log");
    endTour(true); tour.steps = steps; tour.n = -1; tour.on = true; tour.paused = false;
    bar.classList.add("on"); pointer.classList.add("on");
    var p = pointer.getBoundingClientRect(); place(window.innerWidth / 2, 80, true);
    nextStep();
  }
  function endTour(quiet) {
    clearTimeout(tour.timer); tour.on = false;
    bar.classList.remove("on"); pointer.classList.remove("on"); bubble.classList.remove("on");
    if (!quiet) { var b = $("#btn-tour"); if (b) b.focus(); }
  }
  function place(x, y, instant) {
    pointer.style.transition = (reduced || instant) ? "none" : "";
    pointer.style.transform = "translate(" + Math.round(x) + "px," + Math.round(y) + "px)";
  }
  function nextStep() {
    clearTimeout(tour.timer);
    if (!tour.on) return;
    tour.n++;
    if (tour.n >= tour.steps.length) { setBar("Tour finished"); tour.timer = setTimeout(function () { endTour(); }, 1200); return; }
    var st = tour.steps[tour.n], t = $(st.target);
    if (!t && st.fallback) { act(st.fallback); t = $(st.target); }
    if (!t) { nextStep(); return; }
    setBar("Step " + (tour.n + 1) + " of " + tour.steps.length);
    t.scrollIntoView({block: "center", behavior: reduced ? "auto" : "smooth"});
    var wait = reduced ? 30 : 420;
    tour.timer = setTimeout(function () {
      var r = t.getBoundingClientRect();
      var x = r.left + Math.min(r.width / 2, 60), y = r.top + Math.min(r.height / 2, 24);
      place(x, y);
      tour.timer = setTimeout(function () { arrive(st, t, x, y); }, reduced ? 30 : 900);
    }, wait);
  }
  function arrive(st, t, x, y) {
    if (!tour.on) return;
    if (st.act !== "none" && st.act.indexOf("wait:") !== 0) {
      ripple.style.left = x + "px"; ripple.style.top = y + "px";
      ripple.style.setProperty("--rx", "0px"); ripple.style.setProperty("--ry", "0px");
      ripple.classList.remove("go"); void ripple.offsetWidth; if (!reduced) ripple.classList.add("go");
    }
    bubble.textContent = st.caption; bubble.classList.add("on");
    var bx = Math.min(Math.max(8, x + 18), window.innerWidth - 310), by = Math.min(y + 26, window.innerHeight - 90);
    bubble.style.left = bx + "px"; bubble.style.top = by + "px";
    t.classList.add("flash"); setTimeout(function () { t.classList.remove("flash"); }, 900);
    var log = document.body.getAttribute("data-tour-log");
    document.body.setAttribute("data-tour-log", (log ? log + "|" : "") + st.target + (st.act !== "none" ? "!" + st.act.split(":")[0] : ""));
    act(st.act, t);
    if (st.act === "wait:done") {
      var done = function () { document.removeEventListener("gt-help-done", done); hold(st); };
      if (player && player.state().done) { hold(st); } else { document.addEventListener("gt-help-done", done); }
      return;
    }
    hold(st);
  }
  function hold(st) {
    clearTimeout(tour.timer);
    tour.timer = setTimeout(function () { if (tour.paused) { tour.timer = setTimeout(function () { hold(st); }, 300); } else { nextStep(); } }, st.dwell || 2000);
  }
  function act(a, t) {
    try {
      if (a === "click") { t.click(); }
      else if (a === "restart-click") { if (player) player.restart(); }
      else if (a.indexOf("fill:") === 0) { var q = $("#q"); q.value = a.slice(5); q.dispatchEvent(new Event("input")); }
      else if (a.indexOf("go:") === 0) { go(a.slice(3)); }
    } catch (e) { /* a tour step never breaks the page */ }
  }
  $("#t-skip").addEventListener("click", function () { endTour(); });
  $("#t-next").addEventListener("click", function () { if (tour.on) { clearTimeout(tour.timer); nextStep(); } });
  $("#t-pause").addEventListener("click", function () { tour.paused = !tour.paused; setBar($("#tourstep").textContent); if (!tour.paused) { clearTimeout(tour.timer); nextStep(); } });
  $("#t-replay").addEventListener("click", function () { startTour(tour.steps || TOUR); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && tour.on) endTour();
    if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "")) { e.preventDefault(); $("#q").focus(); }
  });
  $("#btn-tour").addEventListener("click", function () { go("", {}); startTour(TOUR); });

  // ---------------------------------------------------------------- the header controls
  var sel = $("#persona");
  sel.appendChild(el("option", {value: "", text: "no one in particular"}));
  Object.keys(META.personas).sort().forEach(function (n) { sel.appendChild(el("option", {value: n, text: n.replace(/-/g, " ")})); });
  sel.addEventListener("change", function () {
    var p = sel.value ? [sel.value] : [];
    go(S.key, {persona: p, plain: p.length ? !!META.personas[p[0]].plain : false});
  });
  $("#btn-plain").addEventListener("click", function () { go(S.key, {plain: !S.plain}); });
  $("#q").addEventListener("input", function () {
    renderSide();
    if (S.key === "all" || S.key === "") { lastHash = null; var m = $("#main"); m.textContent = ""; if (S.key === "") renderIndex(m); else renderAll(m, false); }
  });
  $("#q").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { var hit = ORDER.filter(function (k) { return matches(k, $("#q").value.trim()); }); if (hit.length === 1) go(hit[0]); else go("all"); }
  });
  window.addEventListener("hashchange", route);

  // ---------------------------------------------------------------- start
  window.GT_HELP_API = {pages: function () { return ORDER.slice(); }, tour: function () { startTour(TOUR); }, state: function () { return S; }};
  route();
  document.body.setAttribute("data-ready", "1");
  var seen = store("gt-help-toured");
  if (S.force || (!seen && S.tour)) { store("gt-help-toured", "1"); setTimeout(function () { if (!tour.on) startTour(TOUR); }, 700); }
})();
</script>
</body>
</html>
